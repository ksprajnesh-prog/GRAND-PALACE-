<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | THE GRAND PALACE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            DEFAULT: '#C5A059',
                            dark: '#A6864A',
                            light: 'rgba(197, 160, 89, 0.1)',
                            accent: 'rgba(197, 160, 89, 0.2)',
                        },
                        bg: {
                            deep: '#0C0D0E',
                            card: '#16181A',
                        },
                        text: {
                            main: '#F8F5F2',
                            muted: '#9CA3AF',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        body { background-color: #0C0D0E; color: #F8F5F2; overflow-x: hidden; }
        .bento-card { background-color: #16181A; border: 1px solid rgba(197, 160, 89, 0.2); border-radius: 24px; padding: 24px; position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .bento-card:hover { border-color: rgba(197, 160, 89, 0.5); transform: translateY(-4px); }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="font-sans antialiased">
    <nav id="main-nav" class="fixed w-full z-50 transition-all duration-500 py-6 bg-bg-deep/80 backdrop-blur-md border-bottom border-gold/10">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 group">
                <div class="p-2 rounded-xl bg-gold group-hover:rotate-12 transition-transform shadow-lg">
                    <i data-lucide="hotel" class="text-bg-deep w-6 h-6"></i>
                </div>
                <span class="text-2xl font-serif font-black tracking-tighter text-text-main">
                    GRAND <span class="text-gold">PALACE</span>
                </span>
            </a>
            <div class="hidden lg:flex items-center space-x-10">
                <a href="suites.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-text-muted hover:text-gold transition-colors">Suites</a>
                <a href="dining.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-text-muted hover:text-gold transition-colors">Dining</a>
                <a href="masterclass.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-text-muted hover:text-gold transition-colors">Masterclass</a>
                <a href="reviews.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-gold">Reviews</a>
                <a href="profile.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-text-muted hover:text-gold transition-colors">Profile</a>
                <a href="contact.html" class="text-[10px] uppercase tracking-[0.3em] font-black text-text-muted hover:text-gold transition-colors">Contact</a>
                <a href="booking.html" class="px-8 py-3 bg-gold text-bg-deep text-[10px] uppercase tracking-[0.2em] font-black rounded-full hover:bg-white transition-all transform hover:scale-105">
                    Reserved Stay
                </a>
            </div>
            <button id="mobile-menu-toggle" class="lg:hidden text-text-main"><i data-lucide="menu" class="w-8 h-8"></i></button>
        </div>
    </nav>

    <div id="mobile-menu" class="fixed inset-0 bg-bg-deep z-[60] flex flex-col items-center justify-center space-y-8 translate-x-full transition-transform duration-500">
        <button id="mobile-menu-close" class="absolute top-8 right-8 text-gold"><i data-lucide="x" class="w-10 h-10"></i></button>
        <a href="suites.html" class="text-3xl font-serif font-black text-text-main hover:text-gold">Luxury Suites</a>
        <a href="dining.html" class="text-3xl font-serif font-black text-text-main hover:text-gold">Gourmet Dining</a>
        <a href="masterclass.html" class="text-3xl font-serif font-black text-text-main hover:text-gold">Masterclasses</a>
        <a href="booking.html" class="px-12 py-5 bg-gold text-bg-deep text-lg uppercase font-black rounded-full">Book Experience</a>
    </div>

    <section class="pt-40 py-24 px-6 bg-bg-card relative">
        <div class="container mx-auto">
            <div class="text-center mb-20 reveal active">
                <span class="text-gold uppercase tracking-[0.4em] font-black text-[10px] mb-4 block">Guest Legacy</span>
                <h2 class="text-5xl font-serif font-black text-text-main mb-6">Testimonials of Excellence</h2>
                <div class="w-32 h-1 bg-gold mx-auto"></div>
            </div>

            <div class="columns-1 md:columns-2 lg:columns-3 xl:columns-4 gap-6 space-y-6" id="reviews-container"></div>
        </div>
    </section>

    <script>
        lucide.createIcons();
        const REVIEWS = Array(16).fill(null).map((_, i) => ({
            name: ["Elena V.", "Markus J.", "Sophia L.", "David K.", "Aria S.", "Julian F."][i % 6],
            comment: [
                "The level of detail in service was unparalleled. A truly royal experience from the moment we arrived.",
                "Architectur excellence meets perfect hospitality. The tasting menu was life-changing.",
                "Private and secure. The perfect sanctuary for high-profile stays.",
                "The heritage suite felt like living in a luxury museum.",
                "Best spa experience of my life. Truly world class.",
                "Iconic destination. 5 stars isn't enough."
            ][i % 6],
            rating: 5,
            image: `https://i.pravatar.cc/150?u=${i}`
        }));
        function renderReviews() {
            const container = document.getElementById('reviews-container');
            container.innerHTML = REVIEWS.map((rev, i) => `
                <div class="break-inside-avoid bento-card p-10 group hover:bg-bg-deep transition-all duration-300 reveal active">
                    <div class="mb-8 relative">
                        <i data-lucide="quote" class="absolute -top-6 -left-6 text-gold/5 w-20 h-20"></i>
                        <div class="flex items-center space-x-1 mb-6 relative z-10">
                            ${Array(5).fill('<i data-lucide="star" class="w-3 h-3 fill-gold text-gold"></i>').join('')}
                        </div>
                        <p class="text-text-muted font-light italic leading-relaxed text-xs relative z-10">"${rev.comment}"</p>
                    </div>
                    <div class="flex items-center space-x-4 border-t border-gold/10 pt-8">
                        <img src="${rev.image}" class="w-12 h-12 rounded-full border border-gold/30 p-1 object-cover" alt="${rev.name}">
                        <div>
                            <h4 class="font-serif font-black text-text-main text-sm truncate">${rev.name}</h4>
                            <p class="text-[9px] uppercase tracking-widest text-gold font-black opacity-60">Elite Legacy Member</p>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        renderReviews();
        const mobileMenu = document.getElementById('mobile-menu');
        document.getElementById('mobile-menu-toggle').onclick = () => mobileMenu.classList.remove('translate-x-full');
        document.getElementById('mobile-menu-close').onclick = () => mobileMenu.classList.add('translate-x-full');
    </script>
</body>
</html>
